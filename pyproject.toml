[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "neutrino-sql"
description = "A fast, single-binary Trino CLI. No JVM required."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["trino", "cli", "sql", "presto", "database"]
authors = [{ name = "Lightcone Labs" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Topic :: Database :: Front-Ends",
    "Topic :: Utilities",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/lightconelabs/neutrino"
Repository = "https://github.com/lightconelabs/neutrino"
Changelog = "https://github.com/lightconelabs/neutrino/blob/main/CHANGELOG.md"
Issues = "https://github.com/lightconelabs/neutrino/issues"

[tool.maturin]
bindings = "bin"
manifest-path = "Cargo.toml"
strip = true
